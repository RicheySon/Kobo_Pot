[package]
name = "kobopot"
version = "0.1.0"
edition = "2021"
publish = false
description = "KoboPot Soroban savings-pot contract for the Stellar Testnet sandbox"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
